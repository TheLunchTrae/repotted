<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Repotted</title>
    <link rel="stylesheet" href="/app.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Repotted</h1>
      <p id="status" role="status">Checking your sign-in…</p>
      <a id="sign-in" class="button" href="/api/auth/sign-in" hidden>Sign in with GitHub</a>
      <div id="account" hidden>
        <img id="avatar" alt="" width="40" height="40" />
        <span id="login"></span>
        <button id="sign-out" class="button" type="button">Sign out</button>
      </div>
    </main>
  </body>
</html>
