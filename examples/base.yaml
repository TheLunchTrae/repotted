# Trae's standard setup, from TheLunchTrae/github-setup. Repository profiles
# extend it and add what differs, such as their required status checks.
repository:
  has_projects: false
  allow_auto_merge: false
  allow_update_branch: true
  delete_branch_on_merge: true
  web_commit_signoff_required: true

merge:
  allow_merge_commit: false
  allow_squash_merge: false
  allow_rebase_merge: true

actions:
  enabled: true
  allowed_actions: all
  default_workflow_permissions: read
  can_approve_pull_request_reviews: false

# One rule per ruleset, so each can be bypassed on its own. Repository role 5
# is Admin; `exempt` skips the rules entirely for admins.
rulesets:
  - name: 'Main: Block Creation and Deletion'
    conditions:
      ref_name: { include: ['~DEFAULT_BRANCH'], exclude: [] }
    rules:
      - type: creation
      - type: deletion

  - name: 'Main: Block Force Pushes'
    conditions:
      ref_name: { include: ['~DEFAULT_BRANCH'], exclude: [] }
    rules:
      - type: non_fast_forward

  - name: 'Main: Require PR'
    conditions:
      ref_name: { include: ['~DEFAULT_BRANCH'], exclude: [] }
    rules:
      - type: pull_request
        parameters:
          allowed_merge_methods: [rebase]
          required_approving_review_count: 0

  - name: 'Main: Require Approval'
    bypass_actors:
      - { actor_id: 5, actor_type: RepositoryRole, bypass_mode: exempt }
    conditions:
      ref_name: { include: ['~DEFAULT_BRANCH'], exclude: [] }
    rules:
      - type: pull_request
        parameters:
          required_approving_review_count: 1

  - name: 'Main: Require Code Owner Review'
    bypass_actors:
      - { actor_id: 5, actor_type: RepositoryRole, bypass_mode: exempt }
    conditions:
      ref_name: { include: ['~DEFAULT_BRANCH'], exclude: [] }
    rules:
      - type: pull_request
        parameters:
          require_code_owner_review: true
