# The profile for this repository: the base setup plus its required check.
extends: base.yaml

rulesets:
  - name: 'Main: Require Status Checks'
    bypass_actors:
      - { actor_id: 5, actor_type: RepositoryRole, bypass_mode: exempt }
    conditions:
      ref_name: { include: ['~DEFAULT_BRANCH'], exclude: [] }
    rules:
      - type: required_status_checks
        parameters:
          strict_required_status_checks_policy: false
          required_status_checks:
            - context: quality

# The environment the publish workflow deploys from, open only to release
# tags. Its required reviewer is set on GitHub and kept as it is.
environments:
  - name: npm
    deployment_branch_policy: { protected_branches: false, custom_branch_policies: true }
    branch_policies:
      - { name: 'v*', type: tag }
