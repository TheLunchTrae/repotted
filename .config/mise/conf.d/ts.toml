# Node runs the workspace, the tests and the build;
# pnpm installs the workspace. package.json's devEngines allows the same pnpm
# major.
[tools]
node = "26"
pnpm = "12"

[tasks."ts:install"]
description = "Install the locked TypeScript dependencies with pnpm"
depends = ["ts:lock:check"]
run = "pnpm install --frozen-lockfile"

[tasks."ts:lock"]
description = "Refresh the pnpm lockfile"
run = "pnpm install"

[tasks."ts:lock:check"]
description = "Ensure the pnpm lockfile is present"
run = """
if [ ! -f pnpm-lock.yaml ]; then
  echo "pnpm-lock.yaml is required for TypeScript CI. Run mise run ts:lock and commit the generated lockfile." >&2
  exit 1
fi
"""
# mise runs inline tasks with cmd on Windows, so the POSIX check needs its own form.
run_windows = "if not exist pnpm-lock.yaml (echo pnpm-lock.yaml is required for TypeScript CI. Run mise run ts:lock and commit the generated lockfile. 1>&2 & exit /b 1)"

[tasks."ts:fmt"]
description = "Format TypeScript"
depends = ["ts:install"]
run = "pnpm run format"

[tasks."ts:fmt:check"]
description = "Check TypeScript formatting"
depends = ["ts:install"]
run = "pnpm run format:check"

[tasks."ts:lint"]
description = "Lint TypeScript"
depends = ["ts:install"]
run = "pnpm run lint"

[tasks."ts:type"]
description = "Run TypeScript type checks"
depends = ["ts:install"]
run = "pnpm run typecheck"

[tasks."ts:audit"]
description = "Audit dependencies"
depends = ["ts:install"]
run = "pnpm run audit"

[tasks."ts:knip"]
description = "Fail on unused dependencies, exports, and files"
depends = ["ts:install"]
run = "pnpm run knip"

[tasks."ts:test"]
description = "Run the Vitest tests"
depends = ["ts:install"]
run = "pnpm run test"

[tasks."ts:build"]
description = "Build the repotted CLI into packages/cli/dist"
depends = ["ts:install"]
run = "pnpm run build"

[tasks."ts:node:check"]
description = "Run the built CLI under the oldest supported Node, as npx does"
depends = ["ts:build"]
# The workspace's Node is the newest; this task alone runs the oldest one that
# packages/cli/package.json's engines allows, locally and in CI, and fails
# when engines names another major version.
tools = { node = "22.23.4" }
run = """
set -eu
oldest="$(node -p "require('./packages/cli/package.json').engines.node.replace('>=', '')")"
running="$(node -p "process.versions.node.split('.')[0]")"
if [ "$running" != "$oldest" ]; then
  echo "ts:node:check runs Node $running, but engines allows Node $oldest; set the task's node to the newest $oldest release." >&2
  exit 1
fi
node packages/cli/tests/node-smoke.mjs
"""

[tasks."ts:web:check"]
description = "Build the web app and check that its Worker bundles for deploy"
depends = ["ts:install"]
# A dry run bundles the Worker and reads the static assets as a deploy would,
# and uploads nothing.
env = { WRANGLER_SEND_METRICS = "false" }
run = "pnpm --filter @repotted/web run check"

[tasks."ts:standards"]
description = "Run the TypeScript standards workflow with autofixes"
depends = ["ts:install"]
run = "pnpm run standards"

[tasks."ts:standards:check"]
description = "Run the TypeScript standards CI gate"
# Tests and the Node and web checks run after the static checks, so a
# test that writes temporary files cannot race the static scans.
depends = ["ts:lint", "ts:type", "ts:fmt:check", "ts:audit", "ts:knip"]
run = [{ task = "ts:test" }, { task = "ts:node:check" }, { task = "ts:web:check" }]
