# Node runs the workspace, the tests, the build and the desktop app's CLI;
# pnpm installs the workspace. package.json's packageManager names the same pnpm.
[tools]
node = "26.13.0"
pnpm = "12.18.0"

[tasks."ts:install"]
description = "Install the locked TypeScript dependencies with pnpm"
depends = ["ts:lock:check"]
run = "pnpm install --frozen-lockfile"

[tasks."ts:lock"]
description = "Refresh the pnpm lockfile"
run = "pnpm install"

[tasks."ts:lock:check"]
description = "Ensure the pnpm lockfile is present"
run = """
if [ ! -f pnpm-lock.yaml ]; then
  echo "pnpm-lock.yaml is required for TypeScript CI. Run mise run ts:lock and commit the generated lockfile." >&2
  exit 1
fi
"""
# mise runs inline tasks with cmd on Windows, so the POSIX check needs its own form.
run_windows = "if not exist pnpm-lock.yaml (echo pnpm-lock.yaml is required for TypeScript CI. Run mise run ts:lock and commit the generated lockfile. 1>&2 & exit /b 1)"

[tasks."ts:fmt"]
description = "Format TypeScript"
depends = ["ts:install"]
run = "pnpm run format"

[tasks."ts:fmt:check"]
description = "Check TypeScript formatting"
depends = ["ts:install"]
run = "pnpm run format:check"

[tasks."ts:lint"]
description = "Lint TypeScript"
depends = ["ts:install"]
run = "pnpm run lint"

[tasks."ts:type"]
description = "Run TypeScript type checks"
depends = ["ts:install"]
run = "pnpm run typecheck"

[tasks."ts:audit"]
description = "Audit dependencies"
depends = ["ts:install"]
run = "pnpm run audit"

[tasks."ts:knip"]
description = "Fail on unused dependencies, exports, and files"
depends = ["ts:install"]
run = "pnpm run knip"

[tasks."ts:test"]
description = "Run the Vitest tests"
depends = ["ts:install"]
run = "pnpm run test"

[tasks."ts:build"]
description = "Build the repotted CLI into packages/cli/dist"
depends = ["ts:install"]
run = "pnpm run build"

[tasks."ts:node:check"]
description = "Run the built CLI under the oldest supported Node, as npx does"
depends = ["ts:build"]
# mise's Node is the newest, so CI points SMOKE_NODE at the oldest one the
# package supports. Without it, the check runs under mise's Node.
run = """
set -eu
smoke_node="${SMOKE_NODE:-node}"
echo "Running the built CLI under Node $("$smoke_node" --version)"
"$smoke_node" packages/cli/tests/node-smoke.mjs
"""

[tasks."ts:standards"]
description = "Run the TypeScript standards workflow with autofixes"
depends = ["ts:install"]
run = "pnpm run standards"

[tasks."ts:standards:check"]
description = "Run the TypeScript standards CI gate"
# Tests and the Node check run after the static checks, so a test that writes
# temporary files cannot race the static scans.
depends = ["ts:lint", "ts:type", "ts:fmt:check", "ts:audit", "ts:knip"]
run = [{ task = "ts:test" }, { task = "ts:node:check" }]
