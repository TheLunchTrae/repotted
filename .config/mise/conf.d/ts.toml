[tools]
bun = "1.4.4"

[tasks."ts:install"]
description = "Install Bun-managed TypeScript dependencies"
depends = ["ts:lock:check"]
run = "bun install --frozen-lockfile"

[tasks."ts:lock"]
description = "Refresh the Bun lockfile"
run = "bun install"

[tasks."ts:lock:check"]
description = "Ensure the Bun lockfile is present"
run = """
if [ ! -f bun.lock ]; then
  echo "bun.lock is required for TypeScript CI. Run mise run ts:lock and commit the generated lockfile." >&2
  exit 1
fi
"""
# mise runs inline tasks with cmd on Windows, so the POSIX check needs its own form.
run_windows = "if not exist bun.lock (echo bun.lock is required for TypeScript CI. Run mise run ts:lock and commit the generated lockfile. 1>&2 & exit /b 1)"

[tasks."ts:fmt"]
description = "Format TypeScript"
depends = ["ts:install"]
run = "bun run format"

[tasks."ts:fmt:check"]
description = "Check TypeScript formatting"
depends = ["ts:install"]
run = "bun run format:check"

[tasks."ts:lint"]
description = "Lint TypeScript"
depends = ["ts:install"]
run = "bun run lint"

[tasks."ts:type"]
description = "Run TypeScript type checks"
depends = ["ts:install"]
run = "bun run typecheck"

[tasks."ts:audit"]
description = "Audit dependencies"
depends = ["ts:install"]
run = "bun run audit"

[tasks."ts:knip"]
description = "Fail on unused dependencies, exports, and files"
depends = ["ts:install"]
run = "bun run knip"

[tasks."ts:test"]
description = "Run the Bun tests"
depends = ["ts:install"]
run = "bun run test"

[tasks."ts:build"]
description = "Build the repotted CLI into packages/cli/dist"
depends = ["ts:install"]
run = "bun run build"

[tasks."ts:node:check"]
description = "Run the built CLI under Node, as npx does"
depends = ["ts:build"]
# bunfig.toml routes `node` through Bun inside `bun run`, so this task calls
# `node` itself and first confirms that it is Node, not Bun.
run = """
set -eu
node -e "if (typeof Bun !== 'undefined') { console.error('ts:node:check needs Node on PATH, not Bun'); process.exit(1); }"
node packages/cli/tests/node-smoke.mjs
"""

[tasks."ts:standards"]
description = "Run the TypeScript standards workflow with autofixes"
depends = ["ts:install"]
run = "bun run standards"

[tasks."ts:standards:check"]
description = "Run the TypeScript standards CI gate"
# Tests and the Node check run after the static checks, so a test that writes
# temporary files cannot race the static scans.
depends = ["ts:lint", "ts:type", "ts:fmt:check", "ts:audit", "ts:knip"]
run = [{ task = "ts:test" }, { task = "ts:node:check" }]
