# Lockfile format 3, which `mise lock` writes for a new lockfile, needs at
# least this mise.
min_version = "2026.9.16"

[settings]
lockfile = true
# The platforms the tools are locked for: CI's, and the ones contributors work on.
lockfile_platforms = ["linux-x64", "macos-arm64", "macos-x64", "windows-x64"]

[tools]
gitleaks = "8"

[tasks.secrets]
description = "Scan the working tree for secrets"
# When a run also installs the dependencies, scan after the install, so
# gitleaks never walks node_modules while pnpm is still writing it.
wait_for = ["ts:install"]
run = "gitleaks dir . --redact --no-banner"

[tasks.fmt]
description = "Format the project"
depends = ["ts:fmt"]

[tasks."fmt:check"]
description = "Check formatting"
depends = ["ts:fmt:check"]

[tasks.lint]
description = "Lint and analyze"
depends = ["ts:lint"]

[tasks.test]
description = "Run the tests"
depends = ["ts:test"]

[tasks.standards]
description = "Run standards workflows and available autofixes"
depends = ["ts:standards"]

[tasks."standards:check"]
description = "Run the standards CI gate"
depends = ["secrets", "hygiene", "ts:standards:check"]
