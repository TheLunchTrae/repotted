name: Deploy Web
run-name: ${{ inputs.publish && 'Deploy Web' || 'Deploy Web preview' }}

# The owner starts a run with Run workflow on main; nothing else does, as with
# the release workflows. A run builds the web app and checks the Worker bundle.
# With Publish not selected, the default, it deploys the repotted Worker's
# Preview named for the branch, main.preview.repotted.dev, so repotted.dev keeps
# its version; with Publish selected, it deploys to repotted.dev. The deploy-web
# environment holds the Cloudflare values and allows only main.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to repotted.dev instead of the preview
        type: boolean
        default: false

permissions:
  contents: read

# Runs of each kind wait their turn instead of replacing a waiting run, so the
# last one started is the one that stays live. A preview never holds up a
# publish.
concurrency:
  group: ${{ inputs.publish && 'deploy-web' || 'deploy-web-preview' }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ inputs.publish && 'Deploy to repotted.dev' || 'Deploy the preview' }}
    if: github.repository == 'TheLunchTrae/repotted'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment:
      name: deploy-web
      url: ${{ inputs.publish && 'https://repotted.dev' || steps.deploy.outputs.preview-url }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      # The environment allows only main too; this says so plainly if its
      # branch rule is ever loosened.
      - name: Require main
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Deploy Web runs only on main, not $GITHUB_REF."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a deploy builds only from the locked, checksummed downloads.
      - name: Build and check the web app
        uses: ./.github/actions/gate
        with:
          cache: false
          task: ts:web:check
      # The client ID comes from wrangler.jsonc, and every deploy keeps the
      # client secret already set on the Worker or its Preview.
      - name: Upload the Worker and its assets
        id: deploy
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISH: ${{ inputs.publish }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [[ -z ${!name} ]]; then
              echo "::error::The deploy-web environment has no $name."
              exit 1
            fi
          done
          if [[ $PUBLISH == true ]]; then
            mise exec -- pnpm exec wrangler deploy
            exit 0
          fi
          # The Preview is named for the branch, made a DNS label: lowercase
          # letters, digits and hyphens, at most 40 characters, which leaves
          # room for the deployment ID that deployment addresses put in front.
          preview=$(tr '[:upper:]' '[:lower:]' <<<"$GITHUB_REF_NAME" | sed -E 's/[^a-z0-9]+/-/g; s/^-//; s/-$//' | cut -c -40 | sed -E 's/-$//')
          if [[ -z $preview ]]; then
            echo "::error::The branch name $GITHUB_REF_NAME gives no Preview name."
            exit 1
          fi
          output="$RUNNER_TEMP/wrangler-output.json"
          WRANGLER_OUTPUT_FILE_PATH="$output" mise exec -- pnpm exec wrangler preview --name "$preview"
          # The Preview's addresses on a custom domain, not on workers.dev.
          url=$(jq -r 'select(.type == "preview") | [.preview_urls[]? | select(test("\\.workers\\.dev/?$") | not)] | first // empty' "$output")
          if [[ -z $url ]]; then
            echo "::error::Cloudflare gave the $preview Preview no address on a custom domain. Check that preview.repotted.dev is attached to the repotted Worker for Previews."
            exit 1
          fi
          echo "preview-url=$url" >>"$GITHUB_OUTPUT"
          echo "Preview: <$url>" >>"$GITHUB_STEP_SUMMARY"
