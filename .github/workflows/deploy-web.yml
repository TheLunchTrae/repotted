name: Deploy Web
run-name: ${{ inputs.publish && 'Deploy Web' || 'Deploy Web preview' }}

# The owner starts a run with Run workflow on main; nothing else does, as with
# the release workflows. A run builds the web app and checks the Worker bundle.
# With Publish not selected, the default, it uploads a version of the repotted
# Worker under the preview alias without deploying it, so repotted.dev keeps
# its version; with Publish selected, it deploys to repotted.dev. The
# deploy-web environment holds the Cloudflare and GitHub App values and allows
# only main.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to repotted.dev instead of only uploading a preview
        type: boolean
        default: false

permissions:
  contents: read

# Runs of each kind wait their turn instead of replacing a waiting run, so the
# last one started is the one that stays live or holds the preview alias. A
# preview never holds up a publish.
concurrency:
  group: ${{ inputs.publish && 'deploy-web' || 'deploy-web-preview' }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ inputs.publish && 'Deploy to repotted.dev' || 'Upload a preview' }}
    if: github.repository == 'TheLunchTrae/repotted'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment:
      name: deploy-web
      url: ${{ inputs.publish && 'https://repotted.dev' || steps.deploy.outputs.preview-url }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      # The environment allows only main too; this says so plainly if its
      # branch rule is ever loosened.
      - name: Require main
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Deploy Web runs only on main, not $GITHUB_REF."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a deploy builds only from the locked, checksummed downloads.
      - name: Build and check the web app
        uses: ./.github/actions/gate
        with:
          cache: false
          task: ts:web:check
      # The client secret reaches the Worker as a secret in the same upload as
      # the code, so no version runs without it. The file is readable only by
      # this job's user and is removed when the step ends.
      - name: Upload the Worker and its assets
        id: deploy
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REPOTTED_APP_CLIENT_ID: ${{ vars.REPOTTED_APP_CLIENT_ID }}
          REPOTTED_APP_CLIENT_SECRET: ${{ secrets.REPOTTED_APP_CLIENT_SECRET }}
          PUBLISH: ${{ inputs.publish }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID REPOTTED_APP_CLIENT_ID REPOTTED_APP_CLIENT_SECRET; do
            if [[ -z ${!name} ]]; then
              echo "::error::The deploy-web environment has no $name."
              exit 1
            fi
          done
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077 && jq -n '{REPOTTED_APP_CLIENT_SECRET: env.REPOTTED_APP_CLIENT_SECRET}' >"$secrets")
          if [[ $PUBLISH == true ]]; then
            mise exec -- pnpm exec wrangler deploy --var "REPOTTED_APP_CLIENT_ID:$REPOTTED_APP_CLIENT_ID" --secrets-file "$secrets"
            exit 0
          fi
          output="$RUNNER_TEMP/wrangler-output.json"
          WRANGLER_OUTPUT_FILE_PATH="$output" mise exec -- pnpm exec wrangler versions upload --preview-alias preview --var "REPOTTED_APP_CLIENT_ID:$REPOTTED_APP_CLIENT_ID" --secrets-file "$secrets"
          # Wrangler leaves the alias URL out when the Worker's preview URLs are
          # off, which they are until a deploy applies wrangler.jsonc.
          url=$(jq -r 'select(.type == "version-upload") | .preview_alias_url // empty' "$output")
          if [[ -z $url ]]; then
            echo "::error::The repotted Worker's preview URLs are off. Run Deploy Web with Publish once, or turn them on in the Worker's settings, then run this again."
            exit 1
          fi
          echo "preview-url=$url" >>"$GITHUB_OUTPUT"
          echo "Preview: <$url>" >>"$GITHUB_STEP_SUMMARY"
