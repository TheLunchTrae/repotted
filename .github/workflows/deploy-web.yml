name: Deploy Web
run-name: ${{ inputs.publish && 'Deploy Web' || format('Deploy Web preview of {0}', github.ref_name) }}

# The owner starts a run with Run workflow; nothing else does, as with the
# release workflows. A run builds the web app, checks the Worker bundle, and
# deploys both. With Publish not selected, the default, it deploys the run's
# branch to the preview Worker at preview.repotted.dev, from the
# deploy-web-preview environment. With Publish selected, a run on main deploys
# to repotted.dev, from the deploy-web environment, which allows only main.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to repotted.dev instead of preview.repotted.dev (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Deploys to each Worker wait their turn instead of replacing a waiting run,
# so the last run started is the one that stays live. A preview never holds up
# a publish.
concurrency:
  group: ${{ inputs.publish && 'deploy-web' || 'deploy-web-preview' }}
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    name: ${{ inputs.publish && 'Deploy to repotted.dev' || 'Deploy to preview.repotted.dev' }}
    if: github.repository == 'TheLunchTrae/repotted'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    environment:
      name: ${{ inputs.publish && 'deploy-web' || 'deploy-web-preview' }}
      url: ${{ inputs.publish && 'https://repotted.dev' || 'https://preview.repotted.dev' }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      # The deploy-web environment allows only main too; this says so plainly
      # if its branch rule is ever loosened.
      - name: Require main to publish
        if: inputs.publish
        run: |
          if [[ $GITHUB_REF != refs/heads/main ]]; then
            echo "::error::Deploy Web publishes only from main, not $GITHUB_REF. Run it without Publish to deploy a preview."
            exit 1
          fi
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No cache: a deploy builds only from the locked, checksummed downloads.
      - name: Build and check the web app
        uses: ./.github/actions/gate
        with:
          cache: false
          task: ts:web:check
      # The client secret reaches the Worker as a secret in the same upload as
      # the code, so no version runs without it. The file is readable only by
      # this job's user and is removed when the step ends.
      - name: Deploy the Worker and its assets
        working-directory: packages/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          REPOTTED_APP_CLIENT_ID: ${{ vars.REPOTTED_APP_CLIENT_ID }}
          REPOTTED_APP_CLIENT_SECRET: ${{ secrets.REPOTTED_APP_CLIENT_SECRET }}
          PUBLISH: ${{ inputs.publish }}
          ENVIRONMENT: ${{ inputs.publish && 'deploy-web' || 'deploy-web-preview' }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          for name in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID REPOTTED_APP_CLIENT_ID REPOTTED_APP_CLIENT_SECRET; do
            if [[ -z ${!name} ]]; then
              echo "::error::The $ENVIRONMENT environment has no $name."
              exit 1
            fi
          done
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets"' EXIT
          (umask 077 && jq -n '{REPOTTED_APP_CLIENT_SECRET: env.REPOTTED_APP_CLIENT_SECRET}' >"$secrets")
          # The preview environment in wrangler.jsonc names the repotted-preview Worker.
          target=()
          [[ $PUBLISH == true ]] || target=(--env preview)
          mise exec -- pnpm exec wrangler deploy "${target[@]}" --var "REPOTTED_APP_CLIENT_ID:$REPOTTED_APP_CLIENT_ID" --secrets-file "$secrets"
