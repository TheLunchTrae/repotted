name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the mandatory gate
        uses: ./.github/actions/gate
        with:
          cache: true

  # The app's code differs by platform, such as its shortcuts, labels and
  # settings folder, so its tests also run on the platforms it ships for.
  desktop:
    name: desktop tests on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macOS
            runner: macos-26
          - os: Windows
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the desktop app's tests
        uses: ./.github/actions/gate
        with:
          cache: true
          task: csharp:test
