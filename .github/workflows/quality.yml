name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the oldest supported Node for the npx smoke check
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      # mise puts its newer Node first on the PATH; ts:node:check runs this one.
      - name: Point the npx smoke check at it
        run: echo "SMOKE_NODE=$(command -v node)" >>"$GITHUB_ENV"
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: true
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Run the mandatory gate
        run: mise run standards:check
