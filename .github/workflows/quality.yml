name: Quality

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  merge_group:

permissions:
  contents: read

# A pull request keeps one run, its newest. Any other run, such as a push to
# main, is grouped by its commit, so no commit's run is dropped from the queue
# or waits behind another commit's run.
concurrency:
  group: quality-${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The parent commit too, to tell whether the change touches the web app.
          fetch-depth: 2
      - name: Run the mandatory gate
        uses: ./.github/actions/gate
        with:
          cache: true
      # The layout check needs a browser, so it runs only when a change can
      # move the web app's layout: the web app, the engine it bundles, the
      # fake GitHub it runs on, or how CI runs it. Its steps skip rather than
      # the job, so the required check still reports. A change is diffed
      # against what it lands on: a pull request's merge commit against its
      # first parent, a merge group against its base, and a push against the
      # commit it replaced. When that base can't be read, the check runs.
      - name: Find web app changes
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          PUSHED_OVER: ${{ github.event.before }}
        run: |
          paths=(
            packages/web
            packages/core/src
            packages/core/package.json
            packages/core/tests/fake-github.ts
            pnpm-lock.yaml
            .config/mise
            .github/actions/gate
            .github/workflows/quality.yml
          )
          case "$EVENT" in
            merge_group) base="$GROUP_BASE" ;;
            push) base="$PUSHED_OVER" ;;
            *) base='HEAD^1' ;;
          esac
          # A push that creates a branch has no commit before it.
          if [ -z "${base//0/}" ]; then
            base='HEAD^1'
          fi
          web=true
          if [ "$EVENT" != workflow_dispatch ] \
            && { [ "$base" = 'HEAD^1' ] || git fetch --quiet --depth=1 origin "$base"; } \
            && git diff --quiet "$base" HEAD -- "${paths[@]}"; then
            web=false
          fi
          echo "web=$web" >> "$GITHUB_OUTPUT"
      - name: Find the Playwright version
        id: playwright
        if: steps.changes.outputs.web == 'true'
        run: |
          version="$(mise exec -- node -p "require('./packages/web/node_modules/@playwright/test/package.json').version")"
          if [ -z "$version" ]; then
            echo '::error::Found no version of @playwright/test in packages/web.'
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Restore Chromium
        id: chromium
        if: steps.changes.outputs.web == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}
      # apt's packages aren't cached, so the system libraries install on every run.
      - name: Install Chromium
        if: steps.changes.outputs.web == 'true' && steps.chromium.outputs.cache-hit != 'true'
        run: mise exec -- pnpm --filter @repotted/web exec playwright install --with-deps --only-shell chromium
      - name: Install Chromium's system libraries
        if: steps.changes.outputs.web == 'true' && steps.chromium.outputs.cache-hit == 'true'
        run: mise exec -- pnpm --filter @repotted/web exec playwright install-deps chromium-headless-shell
      - name: Check the web app's layout
        if: steps.changes.outputs.web == 'true'
        run: mise run ts:web:layout
      - name: Upload the layout check's screenshots
        if: failure() && steps.changes.outputs.web == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-layout
          path: artifacts/web-layout
          if-no-files-found: ignore
