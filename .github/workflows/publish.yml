name: Publish

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the release
    if: github.repository == 'TheLunchTrae/repotted' && !github.event.release.prerelease
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Require a stable version tag
        run: '[[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - name: Check out the release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false
      # A tag moved after the release event would build a commit that provenance
      # does not name.
      - name: Require the tag to point at the workflow commit
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
        run: test "$(git rev-parse HEAD)" = "$WORKFLOW_COMMIT"
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Require the tag to match the package version
        run: test "v$(jq -r .version packages/cli/package.json)" = "$RELEASE_TAG"
      - name: Install the oldest supported Node for the npx smoke check
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # No cache: a release builds only from the locked, checksummed tools.
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: false
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Run the mandatory gate
        run: mise run standards:check
      # bun pm pack runs prepack, which builds, and replaces workspace: ranges.
      - name: Pack the verified build
        run: |
          mkdir release
          (cd packages/cli && bun pm pack --destination ../../release)
          cd release
          sha256sum ./*.tgz > SHA256SUMS
      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repotted-release
          path: release/
          if-no-files-found: error
          retention-days: 3

  publish:
    name: Publish to npm
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repotted-release
          path: release
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later.
      - name: Install an npm that supports trusted publishing
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      - name: Publish the verified tarball with OIDC
        working-directory: release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          sha256sum --check SHA256SUMS
          npm publish ./*.tgz --ignore-scripts --access public --tag latest
