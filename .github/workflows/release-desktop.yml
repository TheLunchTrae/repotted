name: Release Desktop
run-name: ${{ inputs.publish && 'Release Desktop' || format('Release Desktop test build on {0}', github.ref_name) }}

# The owner starts a run with Run workflow; nothing else does. With Publish
# off, the default, the run is a test build from any branch: it builds the
# packages, signs them on main, and attests and releases nothing. With Publish
# on, a run on main releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release of the version in the app's project file (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Releases wait their turn instead of replacing a waiting run, so the next
# release's checks see the version the one before it released. Test builds
# wait in a group of their own for each branch, so they never hold up a release.
concurrency:
  group: ${{ inputs.publish && 'release-desktop' || format('release-desktop-test-build-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

jobs:
  verify:
    name: Verify the release
    if: github.repository == 'TheLunchTrae/repotted'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A test build reports what a release would refuse, then goes on.
      - name: Require an unreleased version on main
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() {
            if [[ $PUBLISH == true ]]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
          }
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' desktop/src/Repotted.Desktop/Repotted.Desktop.csproj)"
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::The app's project file has Version $version, not a stable version such as 1.2.3."
            exit 1
          fi
          [[ $GITHUB_REF == refs/heads/main ]] || refuse "A release runs only on main, not $GITHUB_REF."
          # 200 is found and 404 is absent; any other answer stops the run, so
          # a failed request is never read as absent.
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/desktop-v$version" || true)"
          case $code in
            200) refuse "Tag desktop-v$version already exists. Bump Version in the app's project file to release." ;;
            404) ;;
            *)
              echo "::error::Checking for tag desktop-v$version answered $code."
              exit 1
              ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # No cache: a release builds only from the locked, checksummed downloads.
      - name: Run the mandatory gate
        uses: ./.github/actions/gate
        with:
          cache: false

  package:
    name: Package for ${{ matrix.os }} ${{ matrix.arch }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-26
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: windows
            arch: x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    # Notarization alone may wait up to 30 minutes.
    timeout-minutes: 90
    # Only macOS jobs on main reach the signing secrets: only they request the
    # environment, and the environment admits main alone. A test build on main
    # signs and notarizes too, so it proves a release would; one on another
    # branch builds a Mac app signed ad hoc.
    environment: ${{ matrix.os == 'macos' && github.ref == 'refs/heads/main' && 'release-desktop-macos' || '' }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      SIGN: ${{ matrix.os == 'macos' && github.ref == 'refs/heads/main' }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: ${{ github.ref != 'refs/heads/main' }}
      - name: Import the Developer ID certificate
        if: env.SIGN == 'true'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -z $CERTIFICATE || -z $CERTIFICATE_PASSWORD || -z $TEAM_ID ]]; then
            echo "::error::Signing needs DEVELOPER_ID_APPLICATION_P12, DEVELOPER_ID_APPLICATION_P12_PASSWORD and APPLE_TEAM_ID in the release-desktop-macos environment."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application: .* ($TEAM_ID)" | head -n 1 | awk '{print $2}' || true)"
          if [[ -z $identity ]]; then
            echo "::error::The certificate holds no Developer ID Application identity for team $TEAM_ID."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
      - name: Build the app
        run: mise run desktop:package
      - name: Notarize and staple the DMG
        if: env.SIGN == 'true'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [[ -z $KEY || -z $KEY_ID || -z $ISSUER_ID ]]; then
            echo "::error::Notarizing needs APP_STORE_CONNECT_API_KEY_P8, APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID in the release-desktop-macos environment."
            exit 1
          fi
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY" | base64 --decode >"$key"
          dmg="$(ls artifacts/desktop/*.dmg)"
          # A rejection exits non-zero too; keep its answer for the id and status.
          result="$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait --timeout 30m --output-format json)" || true
          echo "$result"
          if [[ "$(jq -r .status <<<"$result" 2>/dev/null || true)" != Accepted ]]; then
            echo "::error::Notarization did not accept $dmg. Run xcrun notarytool log with the id above for the reasons."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Remove the signing keychain
        if: always() && env.SIGN == 'true'
        run: |
          if [[ -n ${MACOS_SIGNING_KEYCHAIN:-} ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
          fi
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  # Only this job can sign attestations. It builds nothing and checks out
  # nothing, so the build steps and the Apple secrets never meet that identity.
  # A test build attests nothing, so it leaves no record of a release.
  attest:
    name: Attest the packages
    needs: package
    if: ${{ inputs.publish }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      # The packages are final here: signed, notarized and stapled, so each
      # attested digest is the file the release offers.
      - name: Attest the packages
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*

  # The release starts as a draft, so its files are attached before it is
  # published and becomes immutable. Publishing creates the tag at the
  # verified commit. Its environment holds no secrets, so the job that can
  # write to the repository never reaches the Apple ones.
  release:
    name: Tag and release
    needs:
      - verify
      - attest
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release-desktop
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Create and publish the release
        working-directory: release
        run: |
          tag="desktop-v$VERSION"
          sha256sum -- * >SHA256SUMS.txt
          status() {
            curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1" || true
          }
          # Verify checked the tag, but a re-run of this job doesn't verify
          # again. A re-run after GitHub published the release finds it done.
          case "$(status "git/ref/tags/$tag")" in
            404) ;;
            200)
              if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" == "$GITHUB_SHA" &&
                "$(status "releases/tags/$tag")" == 200 ]]; then
                echo "$tag is already released at this run's commit."
                exit 0
              fi
              echo "::error::Tag $tag already exists, so this run can't release it."
              exit 1
              ;;
            *)
              echo "::error::Checking for tag $tag failed."
              exit 1
              ;;
          esac
          # A draft left by an earlier attempt may name another commit.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" |
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          previous="$(
            {
              gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/desktop-v" --jq '.[].ref | ltrimstr("refs/tags/desktop-v")'
              echo "$VERSION"
            } | sort -uV | awk -v current="$VERSION" '$0 == current { exit } /^[0-9]+\.[0-9]+\.[0-9]+$/ { last = $0 } END { print last }'
          )"
          notes=(--generate-notes)
          if [[ -n $previous ]]; then
            notes+=(--notes-start-tag "desktop-v$previous")
          fi
          gh release create "$tag" ./* --draft --target "$GITHUB_SHA" --title "Repotted $VERSION" "${notes[@]}"
          if ! gh release edit "$tag" --draft=false --latest; then
            echo "::error::GitHub refused to publish $tag. A tag ruleset that blocks creating desktop-v* tags stops the release; the draft stays, and re-running this job replaces it."
            exit 1
          fi
