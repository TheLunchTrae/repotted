name: Release CLI
run-name: ${{ inputs.publish && 'Release CLI' || format('Release CLI test build on {0}', github.ref_name) }}

# The owner starts a run with Run workflow; nothing else does. With Publish
# not selected, the default, the run is a test build: it checks and packs, and
# attests, publishes and releases nothing. With Publish selected, a run on
# main releases.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release of the version in packages/cli/package.json (main only)
        type: boolean
        default: false

permissions:
  contents: read

# Releases wait their turn instead of replacing a waiting run, so the next
# release's checks see the version the one before it released. Test builds
# wait in a group of their own for each branch, so they never hold up a release.
concurrency:
  group: ${{ inputs.publish && 'release-cli' || format('release-cli-test-build-{0}', github.ref) }}
  cancel-in-progress: false
  queue: max

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify the release
    if: github.repository == 'TheLunchTrae/repotted'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # A test build reports what a release would refuse, then goes on.
      - name: Require an unreleased version on main
        id: version
        env:
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          refuse() {
            if [[ $PUBLISH == true ]]; then
              echo "::error::$1"
              exit 1
            fi
            echo "::warning::$1"
          }
          # 200 is found and 404 is absent; any other answer stops the run, so
          # a failed request is never read as absent.
          found() {
            local code
            code="$(curl -sS -o /dev/null -w '%{http_code}' "${@:2}" "$1")"
            case $code in
              200) return 0 ;;
              404) return 1 ;;
              *)
                echo "::error::$1 answered $code."
                exit 1
                ;;
            esac
          }
          version="$(jq -r .version packages/cli/package.json)"
          if ! [[ $version =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::packages/cli/package.json has version $version, not a stable version such as 1.2.3."
            exit 1
          fi
          [[ $GITHUB_REF == refs/heads/main ]] || refuse "A release runs only on main, not $GITHUB_REF."
          if found "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" -H "Authorization: Bearer $GH_TOKEN"; then
            refuse "Tag v$version already exists. Bump version in packages/cli/package.json to release."
          fi
          if found "https://registry.npmjs.org/repotted/$version"; then
            refuse "npm already has repotted $version. Bump version in packages/cli/package.json to release."
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      # No cache: a release builds only from the locked, checksummed downloads.
      - name: Run the mandatory gate
        uses: ./.github/actions/gate
        with:
          cache: false
      # pnpm pack runs prepack, which builds, and replaces workspace: ranges.
      - name: Pack the verified build
        run: |
          mkdir release
          (cd packages/cli && pnpm pack --pack-destination ../../release)
      - name: Upload the verified package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: repotted-cli
          path: release/
          if-no-files-found: error
          retention-days: 3

  # Only this job can sign attestations, and it builds nothing. A test build
  # attests nothing, so it leaves no record of a release.
  attest:
    name: Attest the package
    needs: verify
    if: ${{ inputs.publish }}
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repotted-cli
          path: release
      - name: Attest the package
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: release/*.tgz

  publish:
    name: Publish to npm
    needs:
      - verify
      - attest
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment: release-cli
    permissions:
      id-token: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download the verified package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: repotted-cli
          path: release
      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      # Trusted publishing needs npm 11.5.1 or later. Provenance comes with it;
      # NPM_CONFIG_PROVENANCE makes the publish fail if it cannot be made.
      - name: Install an npm that supports trusted publishing
        run: npm install --global npm@11.9.0 --ignore-scripts --no-audit --no-fund
      # npm may have taken an earlier attempt that still failed, such as one
      # that timed out after the upload, so a re-run that finds this exact
      # tarball there goes on to the release.
      - name: Publish the verified tarball with OIDC
        working-directory: release
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: |
          tarball="$(echo ./*.tgz)"
          integrity="sha512-$(openssl dgst -sha512 -binary "$tarball" | base64 -w0)"
          code="$(curl -sS -o "$RUNNER_TEMP/published.json" -w '%{http_code}' "https://registry.npmjs.org/repotted/$VERSION" || true)"
          case $code in
            404) npm publish "$tarball" --ignore-scripts ;;
            200)
              if [[ "$(jq -r .dist.integrity "$RUNNER_TEMP/published.json")" != "$integrity" ]]; then
                echo "::error::npm already has a different repotted $VERSION."
                exit 1
              fi
              echo "npm already has this tarball as repotted $VERSION."
              ;;
            *)
              echo "::error::Checking npm for repotted $VERSION answered $code."
              exit 1
              ;;
          esac

  # Runs only after npm accepts the package, so a failed publish leaves no
  # tag or release. It attaches the tarball npm serves, so re-running it after
  # the run's artifact has expired still releases the published file.
  release:
    name: Tag and release
    needs:
      - verify
      - publish
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment: release-cli
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Download the published package
        run: |
          mkdir release
          # The registry can take a few minutes to serve a new version.
          for attempt in $(seq 30); do
            if npm pack "repotted@$VERSION" --pack-destination release --ignore-scripts --silent; then
              break
            fi
            if ((attempt == 30)); then
              echo "::error::npm doesn't serve repotted@$VERSION."
              exit 1
            fi
            sleep 10
          done
          (cd release && sha256sum -- *.tgz >SHA256SUMS.txt)
      # The release starts as a draft, so its files are attached before it is
      # published and becomes immutable. Publishing creates the tag at the
      # verified commit.
      - name: Create and publish the release
        working-directory: release
        run: |
          tag="v$VERSION"
          status() {
            curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
              "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/$1" || true
          }
          # Verify checked the tag, but a re-run of this job doesn't verify
          # again. A re-run after GitHub published the release finds it done.
          case "$(status "git/ref/tags/$tag")" in
            404) ;;
            200)
              if [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" == "$GITHUB_SHA" &&
                "$(status "releases/tags/$tag")" == 200 ]]; then
                echo "$tag is already released at this run's commit."
                exit 0
              fi
              echo "::error::Tag $tag already exists, so this run can't release it."
              exit 1
              ;;
            *)
              echo "::error::Checking for tag $tag failed."
              exit 1
              ;;
          esac
          # A draft left by an earlier attempt may name another commit.
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.draft and .tag_name == \"$tag\") | .id" |
            while read -r id; do
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
            done
          previous="$(
            {
              gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" --jq '.[].ref | ltrimstr("refs/tags/v")'
              echo "$VERSION"
            } | sort -uV | awk -v current="$VERSION" '$0 == current { exit } /^[0-9]+\.[0-9]+\.[0-9]+$/ { last = $0 } END { print last }'
          )"
          notes=(--generate-notes)
          if [[ -n $previous ]]; then
            notes+=(--notes-start-tag "v$previous")
          fi
          gh release create "$tag" ./* --draft --target "$GITHUB_SHA" --title "$tag" "${notes[@]}"
          if ! gh release edit "$tag" --draft=false --latest; then
            echo "::error::GitHub refused to publish $tag. A tag ruleset that blocks creating v* tags stops the release; the draft stays, and re-running this job replaces it."
            exit 1
          fi
