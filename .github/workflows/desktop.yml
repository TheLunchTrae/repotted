name: Build Desktop

# Quality builds and tests the app on every pull request; packaging runs only
# for a release or by hand.
on:
  # A release starts from a pushed tag, not a published release: releases are
  # immutable once published, so the workflow attaches the packages to a draft
  # and the owner publishes it.
  push:
    tags:
      - desktop-v*
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}

jobs:
  verify:
    name: Verify the release
    if: github.repository == 'TheLunchTrae/repotted' && github.event_name == 'push'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - name: Require a desktop version tag
        run: '[[ "$RELEASE_TAG" =~ ^desktop-v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]'
      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a commit on main
        run: git merge-base --is-ancestor HEAD refs/remotes/origin/main
      - name: Require the tag to match the app version
        run: |
          version="$(sed -n 's|.*<Version>\(.*\)</Version>.*|\1|p' desktop/src/Repotted.Desktop/Repotted.Desktop.csproj)"
          test "desktop-v$version" = "$RELEASE_TAG"
      - name: Install the oldest supported Node for the npx smoke check
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      # No cache: a release builds only from the locked, checksummed tools.
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: false
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Run the mandatory gate
        run: mise run standards:check

  package:
    name: Package for ${{ matrix.os }} ${{ matrix.arch }}
    needs: verify
    # A manual run builds without verify; a release needs it.
    if: >-
      !cancelled() &&
      (needs.verify.result == 'success' ||
      (needs.verify.result == 'skipped' && github.event_name == 'workflow_dispatch'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos
            arch: arm64
            runner: macos-26
          - os: macos
            arch: x64
            runner: macos-15-intel
          - os: windows
            arch: x64
            runner: windows-2025
    runs-on: ${{ matrix.runner }}
    # Notarization alone may wait up to 30 minutes.
    timeout-minutes: 90
    # Only a release's macOS jobs reach the signing secrets: only a tag push
    # requests the environment, and the environment admits desktop-v tags alone.
    environment: ${{ github.event_name == 'push' && matrix.os == 'macos' && 'macos-release' || '' }}
    env:
      MISE_LOCKED: '1'
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      DOTNET_NOLOGO: 'true'
      DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.10.19'
          install: true
          cache: ${{ github.event_name == 'workflow_dispatch' }}
      - name: Install locked dependencies
        run: mise run ts:install
      - name: Import the Developer ID certificate
        if: github.event_name == 'push' && matrix.os == 'macos'
        env:
          CERTIFICATE: ${{ secrets.DEVELOPER_ID_APPLICATION_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          if [[ -z $CERTIFICATE || -z $CERTIFICATE_PASSWORD || -z $TEAM_ID ]]; then
            echo "::error::A release needs DEVELOPER_ID_APPLICATION_P12, DEVELOPER_ID_APPLICATION_P12_PASSWORD and APPLE_TEAM_ID in the macos-release environment."
            exit 1
          fi
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(openssl rand -base64 32)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          printf '%s' "$CERTIFICATE" | base64 --decode >"$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          identity="$(security find-identity -v -p codesigning "$keychain" | grep "Developer ID Application: .* ($TEAM_ID)" | head -n 1 | awk '{print $2}' || true)"
          if [[ -z $identity ]]; then
            echo "::error::The certificate holds no Developer ID Application identity for team $TEAM_ID."
            exit 1
          fi
          echo "MACOS_SIGNING_IDENTITY=$identity" >>"$GITHUB_ENV"
          echo "MACOS_SIGNING_KEYCHAIN=$keychain" >>"$GITHUB_ENV"
      - name: Build the app
        run: mise run desktop:package
      - name: Notarize and staple the DMG
        if: github.event_name == 'push' && matrix.os == 'macos'
        env:
          KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          KEY_ID: ${{ vars.APP_STORE_CONNECT_API_KEY_ID }}
          ISSUER_ID: ${{ vars.APP_STORE_CONNECT_API_ISSUER_ID }}
        run: |
          if [[ -z $KEY || -z $KEY_ID || -z $ISSUER_ID ]]; then
            echo "::error::A release needs APP_STORE_CONNECT_API_KEY_P8, APP_STORE_CONNECT_API_KEY_ID and APP_STORE_CONNECT_API_ISSUER_ID in the macos-release environment."
            exit 1
          fi
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$KEY" | base64 --decode >"$key"
          dmg="$(ls artifacts/desktop/*.dmg)"
          # A rejection exits non-zero too; keep its answer for the id and status.
          result="$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$KEY_ID" --issuer "$ISSUER_ID" --wait --timeout 30m --output-format json)" || true
          echo "$result"
          if [[ "$(jq -r .status <<<"$result" 2>/dev/null || true)" != Accepted ]]; then
            echo "::error::Notarization did not accept $dmg. Run xcrun notarytool log with the id above for the reasons."
            exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
      - name: Remove the signing keychain
        if: always() && github.event_name == 'push' && matrix.os == 'macos'
        run: |
          if [[ -n ${MACOS_SIGNING_KEYCHAIN:-} ]]; then
            security delete-keychain "$MACOS_SIGNING_KEYCHAIN"
          fi
      - name: Upload the package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}
          path: |
            artifacts/desktop/*.dmg
            artifacts/desktop/*-setup.exe
          if-no-files-found: error
          retention-days: 3

  upload:
    name: Attach to a draft release
    needs: package
    if: github.event_name == 'push' && !cancelled() && needs.package.result == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download the packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release
      - name: Attach the packages and their checksums
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum -- * >SHA256SUMS.txt
          # A re-run finds the draft from the first run and replaces its files.
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
              --title "Repotted ${RELEASE_TAG#desktop-v}" --notes "Repotted desktop app ${RELEASE_TAG#desktop-v}."
          fi
          gh release upload "$RELEASE_TAG" ./* --repo "$GITHUB_REPOSITORY" --clobber
