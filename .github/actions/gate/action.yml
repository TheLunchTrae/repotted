name: Run the mandatory gate
description: >-
  Installs the pinned tools and the locked dependencies, then runs
  mise run standards:check, or the part of it a job names. Check out the
  repository first, and set MISE_LOCKED and MISE_TRUSTED_CONFIG_PATHS on the
  job.

inputs:
  cache:
    # A release builds only from the locked, checksummed tools, so it keeps
    # the default.
    description: Restore and save mise's tool cache, as true or false.
    required: false
    default: 'false'
  task:
    description: The mise task to run, standards:check unless the job runs one part of it.
    required: false
    default: standards:check

runs:
  using: composite
  steps:
    - name: Install pinned tools
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: '2026.10.19'
        install: true
        cache: ${{ inputs.cache }}
    - name: Install locked dependencies
      shell: bash
      run: mise run ts:install
    - name: Run the mandatory gate
      shell: bash
      env:
        TASK: ${{ inputs.task }}
      run: mise run "$TASK"
