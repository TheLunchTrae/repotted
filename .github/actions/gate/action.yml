name: Run the mandatory gate
description: >-
  Installs the pinned tools, then runs mise run standards:check, or the part
  of it a job names; the task graph installs the locked dependencies where a
  task first needs them. Check out the repository first, and set MISE_LOCKED
  and MISE_TRUSTED_CONFIG_PATHS on the job.

inputs:
  cache:
    # A release builds only from the locked, checksummed downloads, so it
    # keeps the default.
    description: Restore and save the cache of mise's tools, and on Windows NuGet's packages, as true or false.
    required: false
    default: 'false'
  task:
    description: The mise task to run, standards:check unless the job runs one part of it.
    required: false
    default: standards:check

runs:
  using: composite
  steps:
    - name: Install pinned tools
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: '2026.10.19'
        install: true
        cache: ${{ inputs.cache }}
    # Only on Windows does restoring NuGet's cache (about 1 GB) clearly beat a
    # cold restore; it's slower on Linux and barely faster on macOS, and the
    # pnpm store's is slower on every OS. This step only caches: given no
    # version, it installs nothing while the repository root has no
    # global.json, so .NET stays mise's. The SDK version is in the key, since
    # restore can fetch packs that follow it and aren't in the lockfiles.
    - name: Cache NuGet packages
      if: inputs.cache == 'true' && runner.os == 'Windows'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        cache: true
        cache-dependency-path: |
          desktop/**/packages.lock.json
          .config/mise/conf.d/csharp.toml
    # Every task the gate runs that needs node_modules depends on ts:install,
    # so the install overlaps csharp:restore instead of running before it.
    - name: Run the gate task
      shell: bash
      env:
        GATE_TASK: ${{ inputs.task }}
      run: mise run "$GATE_TASK"
