name: Run the mandatory gate
description: >-
  Installs the pinned tools and the locked dependencies, then runs
  mise run standards:check, or the part of it a job names. Check out the
  repository first, and set MISE_LOCKED and MISE_TRUSTED_CONFIG_PATHS on the
  job.

inputs:
  cache:
    # A release builds only from the locked, checksummed downloads, so it
    # keeps the default.
    description: Restore and save the caches of mise's tools, the pnpm store and NuGet's packages, as true or false.
    required: false
    default: 'false'
  task:
    description: The mise task to run, standards:check unless the job runs one part of it.
    required: false
    default: standards:check

runs:
  using: composite
  steps:
    - name: Install pinned tools
      uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
      with:
        version: '2026.10.19'
        install: true
        cache: ${{ inputs.cache }}
    # The next two steps only cache, keyed on the lockfiles: with no version
    # given, neither installs anything, so Node, pnpm and .NET stay mise's.
    - name: Cache the pnpm store
      if: inputs.cache == 'true'
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
      with:
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Cache NuGet packages
      if: inputs.cache == 'true'
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        cache: true
        cache-dependency-path: desktop/**/packages.lock.json
    - name: Install locked dependencies
      shell: bash
      run: mise run ts:install
    - name: Run the gate task
      shell: bash
      env:
        GATE_TASK: ${{ inputs.task }}
      run: mise run "$GATE_TASK"
